<svg xmlns="http://www.w3.org/2000/svg" width="5.5in" height="3.72in" viewBox="0 0 396 268" role="img" aria-label="Membership state machine. State is (r, y). q0 is (0, 0). Dashed arrows are a common enterprise event. Dash-dot arrows are a manual instant revert. Dotted arrows are a change on the SuC, a rule violation. Solid arrows are the enforced events.">
  <style>text { stroke: none; }</style>
  <rect width="396" height="268" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <g fill="#000000" stroke="#000000" font-family="Times New Roman, Times, Liberation Serif, serif">
    <text x="8" y="12" font-size="8">state (r, y)</text>

    <line x1="124" y1="16" x2="124" y2="36" fill="none" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="130" y="28" font-size="8">q0</text>

    <circle cx="124" cy="58" r="20" fill="#ffffff" stroke-width="0.9"/>
    <text x="124" y="56" text-anchor="middle" font-size="8">(0, 0)</text>
    <text x="124" y="68" text-anchor="middle" font-size="6">e = empty</text>

    <circle cx="292" cy="58" r="20" fill="#ffffff" stroke-width="0.9"/>
    <text x="292" y="56" text-anchor="middle" font-size="8">(1, 0)</text>
    <text x="292" y="68" text-anchor="middle" font-size="6">e = add</text>

    <circle cx="292" cy="188" r="20" fill="#ffffff" stroke-width="0.9"/>
    <text x="292" y="186" text-anchor="middle" font-size="8">(1, 1)</text>
    <text x="292" y="198" text-anchor="middle" font-size="6">e = empty</text>

    <circle cx="124" cy="188" r="20" fill="#ffffff" stroke-width="0.9"/>
    <text x="124" y="186" text-anchor="middle" font-size="8">(0, 1)</text>
    <text x="124" y="198" text-anchor="middle" font-size="6">e = remove</text>

    <path d="M 139 45 Q 208 18, 277 45" fill="none" stroke-width="0.9" stroke-dasharray="4.5 2" marker-end="url(#arrow)"/>
    <text x="208" y="22" text-anchor="middle" font-size="8" font-style="italic">Add to AD-Group on IdP</text>

    <path d="M 276 70 Q 208 94, 140 70" fill="none" stroke-width="0.9" stroke-dasharray="5 1.7 0.8 1.7" marker-end="url(#arrow)"/>
    <text x="208" y="100" text-anchor="middle" font-size="8" font-style="italic">manual instant revert</text>

    <path d="M 276 176 Q 208 160, 140 176" fill="none" stroke-width="0.9" stroke-dasharray="4.5 2" marker-end="url(#arrow)"/>
    <text x="208" y="156" text-anchor="middle" font-size="8" font-style="italic">Removed from AD-Group on IdP</text>

    <path d="M 132 206 Q 208 228, 284 206" fill="none" stroke-width="0.9" stroke-dasharray="5 1.7 0.8 1.7" marker-end="url(#arrow)"/>
    <text x="208" y="236" text-anchor="middle" font-size="8" font-style="italic">manual instant revert</text>

    <path d="M 307 71 Q 341 123, 307 175" fill="none" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text font-size="8" font-style="italic">
      <tspan x="332" y="118">&#x3B4;((1, 0), add(*))</tspan>
      <tspan x="332" y="128">event</tspan>
    </text>

    <path d="M 280 172 Q 224 123, 280 74" fill="none" stroke-width="0.9" stroke-dasharray="0.15 2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="244" y="136" text-anchor="end" font-size="8" font-style="italic">manual change on SuC</text>

    <path d="M 109 175 Q 59 123, 109 71" fill="none" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text text-anchor="end" font-size="8" font-style="italic">
      <tspan x="76" y="118">&#x3B4;((0, 1), remove(*))</tspan>
      <tspan x="76" y="128">event</tspan>
    </text>

    <path d="M 136 74 Q 160 123, 136 172" fill="none" stroke-width="0.9" stroke-dasharray="0.15 2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="156" y="116" font-size="8" font-style="italic">manual change on SuC</text>

    <path d="M 105 65 C 74 62, 74 36, 107 48" fill="none" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="52" y="44" text-anchor="middle" font-size="8" font-style="italic">&#x3C3; = none</text>

    <path d="M 307 201 C 338 214, 338 192, 312 186" fill="none" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="322" y="224" font-size="8" font-style="italic">&#x3C3; = none</text>

    <line x1="34" y1="254" x2="48" y2="254" fill="none" stroke-width="0.9" stroke-dasharray="4.5 2" marker-end="url(#arrow)"/>
    <text x="54" y="257" font-size="8">common enterprise event</text>
    <line x1="146" y1="254" x2="160" y2="254" fill="none" stroke-width="0.9" stroke-dasharray="5 1.7 0.8 1.7" marker-end="url(#arrow)"/>
    <text x="166" y="257" font-size="8">manual instant revert</text>
    <line x1="246" y1="254" x2="260" y2="254" fill="none" stroke-width="0.9" stroke-dasharray="0.15 2.3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="266" y="257" font-size="8">change on SuC, rule violation</text>
  </g>
</svg>
