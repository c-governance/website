<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 4560 1360" role="img" aria-label="Membership and elevator door, the same state machine. State is (r, y). q0 is (0, 0). Membership: add and remove a member. Elevator door: Closed, Opening, Open, Closing. Green arrows change the reference r. Dashed arrows are a manual instant revert, not a real transition. Red arrows are a change on the SuC, a rule violation. Other arrows are the controller event.">
  <rect x="-140" width="4560" height="1360" fill="#1c2836"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4f6f8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3dce6e"/>
    </marker>
    <marker id="arrow-revert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4c0cb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b63"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Liberation Sans, sans-serif" fill="#f4f6f8">
    <text x="940" y="52" text-anchor="middle" font-size="32" font-weight="600">Membership</text>
    <text x="940" y="92" text-anchor="middle" font-size="22" fill="#b4c0cb">r = in the AD group, y = on the SuC</text>

    <text x="2110" y="64" text-anchor="middle" font-size="52" font-weight="600">&#x2261;</text>
    <text x="2110" y="102" text-anchor="middle" font-size="20" fill="#b4c0cb">same machine</text>

    <text x="3220" y="52" text-anchor="middle" font-size="32" font-weight="600">Elevator door</text>
    <text x="3220" y="92" text-anchor="middle" font-size="22" fill="#b4c0cb">r = commanded open, y = door is open</text>
  </g>

  <g font-family="Segoe UI, Liberation Sans, sans-serif" fill="#f4f6f8" transform="translate(0, 140)">
    <text x="48" y="42" font-size="24" fill="#b4c0cb">state (r, y)</text>

    <line x1="560" y1="150" x2="560" y2="248" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="574" y="210" font-size="24" font-weight="600" fill="#9ec0e0">q0</text>

    <circle cx="560" cy="340" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="560" y="318" text-anchor="middle" font-size="26" font-weight="600">(0, 0)</text>
    <text x="560" y="348" text-anchor="middle" font-size="16" fill="#b4c0cb">Request: No</text>
    <text x="560" y="376" text-anchor="middle" font-size="20" fill="#b4c0cb">e = empty</text>

    <circle cx="1320" cy="340" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="1320" y="318" text-anchor="middle" font-size="26" font-weight="600">(1, 0)</text>
    <text x="1320" y="348" text-anchor="middle" font-size="18" fill="#b4c0cb">Adding</text>
    <text x="1320" y="376" text-anchor="middle" font-size="20" fill="#b4c0cb">e = add</text>

    <circle cx="1320" cy="800" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="1320" y="778" text-anchor="middle" font-size="26" font-weight="600">(1, 1)</text>
    <text x="1320" y="808" text-anchor="middle" font-size="16" fill="#b4c0cb">Request: Done</text>
    <text x="1320" y="836" text-anchor="middle" font-size="20" fill="#b4c0cb">e = empty</text>

    <circle cx="560" cy="800" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="560" y="778" text-anchor="middle" font-size="26" font-weight="600">(0, 1)</text>
    <text x="560" y="808" text-anchor="middle" font-size="18" fill="#b4c0cb">Removing</text>
    <text x="560" y="836" text-anchor="middle" font-size="20" fill="#b4c0cb">e = remove</text>

    <path d="M 636 300 Q 940 150, 1244 300" fill="none" stroke="#3dce6e" stroke-width="2.75" marker-end="url(#arrow-green)"/>
    <text x="940" y="148" text-anchor="middle" font-size="28" font-style="italic" fill="#3dce6e">Add to AD-Group on IdP</text>

    <path d="M 1244 380 Q 940 500, 636 380" fill="none" stroke="#b4c0cb" stroke-width="2.25" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrow-revert)"/>
    <text x="940" y="478" text-anchor="middle" font-size="26" font-style="italic" fill="#b4c0cb">manual instant revert</text>

    <path d="M 1244 760 Q 940 620, 636 760" fill="none" stroke="#3dce6e" stroke-width="2.75" marker-end="url(#arrow-green)"/>
    <text x="940" y="656" text-anchor="middle" font-size="28" font-style="italic" fill="#3dce6e">Removed from AD-Group on IdP</text>

    <path d="M 636 840 Q 940 980, 1244 840" fill="none" stroke="#b4c0cb" stroke-width="2.25" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrow-revert)"/>
    <text x="940" y="1036" text-anchor="middle" font-size="26" font-style="italic" fill="#b4c0cb">manual instant revert</text>

    <path d="M 1396 416 Q 1540 570, 1396 724" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="1740" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3B4;((1, 0), add(*)), network event</text>

    <path d="M 1248 724 Q 1080 570, 1248 416" fill="none" stroke="#ff6b63" stroke-width="2.75" marker-end="url(#arrow-red)"/>
    <text x="1000" y="608" text-anchor="middle" font-size="26" font-style="italic" fill="#ff6b63">manual change on SuC</text>

    <path d="M 484 724 Q 300 570, 484 416" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="120" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3B4;((0, 1), remove(*)), network event</text>

    <path d="M 632 416 Q 800 570, 632 724" fill="none" stroke="#ff6b63" stroke-width="2.75" marker-end="url(#arrow-red)"/>
    <text x="880" y="540" text-anchor="middle" font-size="26" font-style="italic" fill="#ff6b63">manual change on SuC</text>

    <path d="M 500 290 C 420 200, 500 150, 548 270" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="430" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3C3; = none</text>

    <path d="M 1384 860 C 1520 940, 1280 1000, 1268 870" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="1500" y="980" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3C3; = none</text>
  </g>

  <g font-family="Segoe UI, Liberation Sans, sans-serif" fill="#f4f6f8" transform="translate(2280, 140)">
    <text x="48" y="42" font-size="24" fill="#b4c0cb">state (r, y)</text>

    <line x1="560" y1="150" x2="560" y2="248" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="574" y="210" font-size="24" font-weight="600" fill="#9ec0e0">q0</text>

    <circle cx="560" cy="340" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="560" y="318" text-anchor="middle" font-size="26" font-weight="600">(0, 0)</text>
    <text x="560" y="348" text-anchor="middle" font-size="18" fill="#b4c0cb">Closed</text>
    <text x="560" y="376" text-anchor="middle" font-size="20" fill="#b4c0cb">e = empty</text>

    <circle cx="1320" cy="340" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="1320" y="318" text-anchor="middle" font-size="26" font-weight="600">(1, 0)</text>
    <text x="1320" y="348" text-anchor="middle" font-size="18" fill="#b4c0cb">Opening</text>
    <text x="1320" y="376" text-anchor="middle" font-size="20" fill="#b4c0cb">e = open</text>

    <circle cx="1320" cy="800" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="1320" y="778" text-anchor="middle" font-size="26" font-weight="600">(1, 1)</text>
    <text x="1320" y="808" text-anchor="middle" font-size="18" fill="#b4c0cb">Open</text>
    <text x="1320" y="836" text-anchor="middle" font-size="20" fill="#b4c0cb">e = empty</text>

    <circle cx="560" cy="800" r="76" fill="#243244" stroke="#f4f6f8" stroke-width="2.25"/>
    <text x="560" y="778" text-anchor="middle" font-size="26" font-weight="600">(0, 1)</text>
    <text x="560" y="808" text-anchor="middle" font-size="18" fill="#b4c0cb">Closing</text>
    <text x="560" y="836" text-anchor="middle" font-size="20" fill="#b4c0cb">e = close</text>

    <path d="M 636 300 Q 940 150, 1244 300" fill="none" stroke="#3dce6e" stroke-width="2.75" marker-end="url(#arrow-green)"/>
    <text x="940" y="148" text-anchor="middle" font-size="28" font-style="italic" fill="#3dce6e">Door open requested</text>

    <path d="M 1244 380 Q 940 500, 636 380" fill="none" stroke="#b4c0cb" stroke-width="2.25" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrow-revert)"/>
    <text x="940" y="478" text-anchor="middle" font-size="26" font-style="italic" fill="#b4c0cb">manual instant revert</text>

    <path d="M 1244 760 Q 940 620, 636 760" fill="none" stroke="#3dce6e" stroke-width="2.75" marker-end="url(#arrow-green)"/>
    <text x="940" y="656" text-anchor="middle" font-size="28" font-style="italic" fill="#3dce6e">Door close requested</text>

    <path d="M 636 840 Q 940 980, 1244 840" fill="none" stroke="#b4c0cb" stroke-width="2.25" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrow-revert)"/>
    <text x="940" y="1036" text-anchor="middle" font-size="26" font-style="italic" fill="#b4c0cb">manual instant revert</text>

    <path d="M 1396 416 Q 1540 570, 1396 724" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="1740" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3B4;((1, 0), open(*)), sensor event</text>

    <path d="M 1248 724 Q 1080 570, 1248 416" fill="none" stroke="#ff6b63" stroke-width="2.75" marker-end="url(#arrow-red)"/>
    <text x="1000" y="608" text-anchor="middle" font-size="26" font-style="italic" fill="#ff6b63">door forced to close</text>

    <path d="M 484 724 Q 300 570, 484 416" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="120" y="574" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3B4;((0, 1), close(*)), sensor event</text>

    <path d="M 632 416 Q 800 570, 632 724" fill="none" stroke="#ff6b63" stroke-width="2.75" marker-end="url(#arrow-red)"/>
    <text x="880" y="540" text-anchor="middle" font-size="26" font-style="italic" fill="#ff6b63">door forced to open</text>

    <path d="M 500 290 C 420 200, 500 150, 548 270" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="430" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3C3; = none</text>

    <path d="M 1384 860 C 1520 940, 1280 1000, 1268 870" fill="none" stroke="#f4f6f8" stroke-width="1.75" marker-end="url(#arrow)"/>
    <text x="1500" y="980" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="26" font-style="italic" fill="#f4f6f8">&#x3C3; = none</text>
  </g>

  <g font-family="Segoe UI, Liberation Sans, sans-serif" fill="#f4f6f8">
    <line x1="980" y1="1268" x2="1068" y2="1268" stroke="#3dce6e" stroke-width="2.75" marker-end="url(#arrow-green)"/>
    <text x="1086" y="1278" font-size="26">change of the reference r</text>
    <line x1="1680" y1="1268" x2="1768" y2="1268" stroke="#b4c0cb" stroke-width="2.25" stroke-dasharray="8 7" stroke-linecap="round" marker-end="url(#arrow-revert)"/>
    <text x="1786" y="1278" font-size="26">manual instant revert, not real</text>
    <line x1="2460" y1="1268" x2="2548" y2="1268" stroke="#ff6b63" stroke-width="2.75" marker-end="url(#arrow-red)"/>
    <text x="2566" y="1278" font-size="26">change on SuC, rule violation</text>
  </g>
</svg>
