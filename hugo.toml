baseURL = 'https://continuous-governance.org/'
locale = 'en-us'
title = 'Continuous Governance'
publishDir = 'docs'
cleanDestinationDir = true

disableKinds = ['taxonomy', 'term', 'RSS']

[outputs]
  home = ['html', 'llms', 'llmsfull', 'markdown']

[mediaTypes.'text/markdown']
  suffixes = ['md']

[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  mediaType = 'text/plain'
  baseName = 'llms-full'
  isPlainText = true
  notAlternative = true

[outputFormats.markdown]
  mediaType = 'text/markdown'
  baseName = 'index'
  isPlainText = true
  rel = 'alternate'
  notAlternative = false

[markup.goldmark.extensions]
  definitionList = true

[markup.goldmark.renderer]
  unsafe = true

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
